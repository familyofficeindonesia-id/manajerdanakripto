name: Uji Umpan Berita

# Dua tugas dalam satu alur:
#   periksa : uji kesehatan seluruh umpan di config/sources.yaml
#   cari    : temukan alamat RSS resmi untuk domain yang bermasalah
# Keduanya TIDAK mengubah apa pun.
on:
  workflow_dispatch:
    inputs:
      tugas:
        description: 'Pilih tugas'
        type: choice
        required: true
        default: 'periksa'
        options:
          - periksa
          - cari
      domain:
        description: 'Untuk tugas cari: domain dipisah spasi (kosong = daftar bermasalah)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Periksa kesehatan umpan
        if: ${{ inputs.tugas == 'periksa' }}
        run: python src/mdk/uji_umpan.py --config config/sources.yaml | tee hasil.txt

      - name: Cari alamat umpan resmi
        if: ${{ inputs.tugas == 'cari' }}
        run: |
          if [ -z "${{ inputs.domain }}" ]; then
            python src/mdk/cari_umpan.py --bermasalah | tee hasil.txt
          else
            python src/mdk/cari_umpan.py ${{ inputs.domain }} | tee hasil.txt
          fi

      - name: Ringkasan
        if: always()
        run: |
          {
            echo '### Hasil — tugas `${{ inputs.tugas }}`'
            echo ''
            echo '```'
            cat hasil.txt 2>/dev/null || echo "(tidak ada keluaran)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
