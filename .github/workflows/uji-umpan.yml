name: Uji Umpan Berita

# Memeriksa apakah setiap umpan RSS di config/sources.yaml masih hidup dan
# menyertakan tanggal terbit. TIDAK mengubah apa pun.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Periksa umpan
        run: python src/mdk/uji_umpan.py --config config/sources.yaml | tee hasil-umpan.txt

      - name: Ringkasan
        if: always()
        run: |
          {
            echo '### Kesehatan umpan berita'
            echo ''
            echo '```'
            cat hasil-umpan.txt 2>/dev/null || echo "(tidak ada keluaran)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
