name: Ambil berita dan terbitkan situs

# =============================================================================
# JADWAL — dua irama berbeda
# -----------------------------------------------------------------------------
# Jadwal dinyatakan dalam UTC. WIB = UTC+7.
#
#   RINGAN  — setiap jam, menit :20
#     Hanya membaca umpan RSS langsung penerbit (kueri_entitas dimatikan).
#     Cepat, hemat, dan aman dijalankan 24x sehari. Menulis maksimal 3 artikel
#     per jalan, sehingga terbitan MENETES sepanjang hari alih-alih menumpuk
#     tiga kali sehari lalu sepi berjam-jam.
#
#   PENUH   — 4x sehari (01:50, 07:50, 13:50, 19:50 UTC
#             = 08.50, 14.50, 20.50, 02.50 WIB)
#     Menyertakan kueri entitas ke Google News. Langkah ini mengirim ratusan
#     permintaan (64+ tokoh x 2 alias x 2 template), jadi TIDAK boleh dijalankan
#     tiap jam — Google akan membatasi atau memblokir alamat IP runner.
#     Menulis maksimal 8 artikel per jalan.
#
# Catatan: cron GitHub Actions sering telat 5-20 menit pada jam sibuk dan
# sesekali dilewati sama sekali. Menit :20 dan :50 dipilih karena beban
# penjadwal GitHub paling berat tepat di menit :00.
# =============================================================================
on:
  schedule:
    - cron: "20 * * * *"
    - cron: "50 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      batas:
        description: "Jumlah maksimum artikel yang ditulis pada jalannya ini"
        required: false
        default: "10"
      izinkan_basis_data_kosong:
        description: "Mulai dari basis data kosong (HANYA bila semua cache benar-benar hilang)"
        type: boolean
        required: false
        default: false
      hapus_penanda_kuota:
        description: "Paksa mencoba menulis walau penanda kuota masih terpasang"
        type: boolean
        required: false
        default: false

permissions:
  contents: write     # untuk menyimpan kembali basis data artikel
  pages: write
  id-token: write

# Wajib ada pada jadwal serapat ini. Tanpa ini, satu jalan yang melambat bisa
# ditabrak jalan berikutnya, dan keduanya berebut menerbitkan ke Pages.
concurrency:
  group: terbit
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    # 75 menit, bukan 45. Jalan penuh #62 sudah memakan 39 menit dengan susunan
    # umpan lama; dengan umpan tambahan, batas 45 terlalu mepet. Jalan ringan
    # tiap jam tetap selesai di bawah 10 menit, jadi angka ini hanya jaring
    # pengaman untuk empat jalan penuh per hari.
    timeout-minutes: 75

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Tentukan mode jalan
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE=penuh
            BATAS="${{ github.event.inputs.batas || 10 }}"
          elif [ "${{ github.event.schedule }}" = "50 1,7,13,19 * * *" ]; then
            MODE=penuh
            BATAS=8
          else
            MODE=ringan
            BATAS=3
          fi
          echo "mode=$MODE"   >> "$GITHUB_OUTPUT"
          echo "batas=$BATAS" >> "$GITHUB_OUTPUT"
          echo "Mode jalan: $MODE (batas $BATAS artikel)"

      # Kueri entitas hanya dipakai pada jalan penuh. Berkas konfigurasi disunting
      # di dalam runner saja; repositori tidak ikut berubah, karena checkout
      # bersifat sementara dan alur ini tidak pernah mendorong balik config/.
      - name: Matikan kueri entitas (jalan ringan)
        if: steps.mode.outputs.mode == 'ringan'
        run: |
          sed -i '/^kueri_entitas:/,/^[a-z_]/ s/^  aktif: true/  aktif: false/' config/sources.yaml
          grep -A1 '^kueri_entitas:' config/sources.yaml

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Pulihkan basis data artikel
        id: pulihkan
        uses: actions/cache/restore@v4
        with:
          path: data/mdk.sqlite3
          key: mdk-db-${{ github.run_id }}
          restore-keys: mdk-db-

      # ---------------------------------------------------------------------
      # PENGAMAN 1 — jangan pernah bekerja di atas basis data yang gagal pulih.
      #
      # Ini kelemahan yang menghapus seluruh arsip pada 30 Agustus 2026. Jalan
      # 33276874408 menemui gangguan jaringan sesaat:
      #
      #   Failed to restore: GetCacheEntryDownloadURL ... ECONNRESET
      #   Cache not found for input keys: mdk-db-33276874408, mdk-db-
      #
      # Cache-nya ADA, hanya gagal diunduh. Tetapi actions/cache/restore
      # memperlakukan kegagalan unduh sebagai peringatan, bukan kesalahan, jadi
      # jalan itu lanjut, membuat basis data kosong, dan menyimpannya sebagai
      # cache terbaru. Sejak itu setiap jalan memulihkan yang kosong.
      #
      # Berhenti di sini jauh lebih murah daripada kehilangan arsip. Bila cache
      # memang benar-benar habis (misalnya semua kedaluwarsa setelah tujuh hari
      # tanpa jalan), jalankan alur ini secara manual dan centang
      # `izinkan_basis_data_kosong`.
      # ---------------------------------------------------------------------
      - name: Pastikan basis data benar-benar pulih
        run: |
          BOLEH_KOSONG="${{ github.event.inputs.izinkan_basis_data_kosong }}"

          if [ ! -s data/mdk.sqlite3 ]; then
            if [ "$BOLEH_KOSONG" = "true" ]; then
              echo "::warning::Basis data tidak ada, tetapi dimulai dari kosong atas permintaan."
              echo "UKURAN_AWAL=0" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Basis data gagal dipulihkan dari cache."
            echo "Cache kunci '${{ steps.pulihkan.outputs.cache-matched-key }}' tidak terbaca."
            echo "Jalan dihentikan agar tidak menimpa cache lama dengan basis data kosong."
            echo "Periksa Actions > Caches. Bila masih ada entri mdk-db- berukuran wajar,"
            echo "cukup jalankan ulang alur ini; gangguan jaringan biasanya sesaat."
            exit 1
          fi

          UKURAN=$(stat -c%s data/mdk.sqlite3)
          echo "UKURAN_AWAL=$UKURAN" >> "$GITHUB_ENV"
          echo "Basis data pulih dari '${{ steps.pulihkan.outputs.cache-matched-key }}' — $UKURAN byte"

          # Basis data sehat berukuran ratusan KB. Yang tercemar hanya 3-23 KB.
          if [ "$UKURAN" -lt 204800 ] && [ "$BOLEH_KOSONG" != "true" ]; then
            echo "::error::Basis data hanya $UKURAN byte — jauh di bawah ukuran wajar."
            echo "Kemungkinan besar cache ini tercemar. Hapus entri tersebut di"
            echo "Actions > Caches, lalu jalankan ulang agar cache lama yang sehat terpakai."
            exit 1
          fi

      - name: Uji kesehatan konfigurasi
        env:
          PYTHONPATH: src
        run: python -m mdk periksa

      - name: Ambil umpan berita
        env:
          PYTHONPATH: src
        run: python -m mdk ambil

      # ---------------------------------------------------------------------
      # PENGAMAN 4 — pemutus arus kuota Gemini.
      #
      # Kuota harian Gemini tingkat gratis habis jauh sebelum antrean habis:
      # pada 31 Agustus 2026 kolam kandidat berisi 80 item, tetapi tiap jalan
      # hanya sanggup menulis 1 artikel sebelum menabrak 429, lalu membakar 3
      # request gagal sebelum berhenti sendiri.
      #
      # Dengan jadwal ~20 jalan per hari, itu sekitar 60 request terbuang setiap
      # hari — diambil dari jatah yang sama dengan artikel asli. Gerbang ini
      # membaca penanda yang dipasang saat 429 pertama, lalu melewati tahap
      # tulis sampai jendela reset lewat. Langkah bangun dan terbit tetap jalan,
      # jadi situs tetap diperbarui walau tidak ada artikel baru.
      #
      # Bila penanda salah terpasang, jalankan manual dan centang
      # `hapus_penanda_kuota`.
      # ---------------------------------------------------------------------
      - name: Hapus penanda kuota atas permintaan
        if: github.event.inputs.hapus_penanda_kuota == 'true'
        env:
          PYTHONPATH: src
          MDK_BASIS_DATA: data/mdk.sqlite3
        run: python -m mdk.kuota hapus

      - name: Periksa status kuota Gemini
        id: kuota
        env:
          PYTHONPATH: src
          MDK_BASIS_DATA: data/mdk.sqlite3
        run: python -m mdk.kuota periksa

      - name: Lewati tahap tulis (kuota masih habis)
        if: steps.kuota.outputs.boleh != 'true'
        run: |
          echo "::warning::Tahap tulis dilewati — penanda kuota Gemini masih terpasang."
          echo "Antrean tetap terisi dan situs tetap dibangun ulang."

      # Penanda kuota biasanya dipasang langsung oleh rewrite.py saat menangkap
      # KuotaHabis. Grep di bawah hanya jaring pengaman, untuk keadaan ketika
      # rewrite.py belum sempat menulis penanda (misalnya proses terbunuh oleh
      # batas waktu tepat setelah menerima 429).
      #
      # Polanya sengaja SEMPIT — hanya frasa kuota harian. Kode 429 saja tidak
      # cukup: batas per menit juga bermuatan 429, sifatnya sesaat, dan tidak
      # boleh menghentikan penulisan berjam-jam.
      - name: Tulis ulang menjadi artikel Bahasa Indonesia
        if: steps.kuota.outputs.boleh == 'true'
        continue-on-error: true      # situs tetap terbit walau langkah ini gagal
        env:
          PYTHONPATH: src
          MDK_BASIS_DATA: data/mdk.sqlite3
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python -m mdk tulis --batas ${{ steps.mode.outputs.batas }} 2>&1 | tee /tmp/tulis.log
          KODE=${PIPESTATUS[0]}

          if grep -qiE 'kuota harian habis|Kuota API habis' /tmp/tulis.log; then
            echo "::warning::Kuota harian Gemini habis pada jalan ini."
            python -m mdk.kuota tandai
          fi

          exit $KODE

      - name: Bangun situs statis
        env:
          PYTHONPATH: src
        run: python -m mdk bangun

      - name: Tulis berkas CNAME (domain kustom)
        run: echo "manajerdanakripto.com" > dist/CNAME

      # ---------------------------------------------------------------------
      # PENGAMAN 2 — jangan simpan basis data yang menyusut.
      #
      # `if: always()` pada langkah simpan adalah separuh kedua dari kegagalan
      # 30 Agustus: ia menyimpan cache bahkan setelah langkah sebelumnya gagal.
      # Sekarang penyimpanan hanya terjadi bila seluruh jalan sehat DAN ukuran
      # basis data tidak turun drastis dibanding saat dipulihkan.
      #
      # Ambang 70% memberi ruang bagi penyusutan wajar (VACUUM, pembersihan
      # berita basi) sambil tetap menghadang kehilangan besar.
      # ---------------------------------------------------------------------
      - name: Periksa kewajaran basis data sebelum disimpan
        id: periksa_db
        run: |
          if [ ! -s data/mdk.sqlite3 ]; then
            echo "::error::Basis data hilang di akhir jalan. Cache TIDAK disimpan."
            exit 1
          fi
          UKURAN_AKHIR=$(stat -c%s data/mdk.sqlite3)
          echo "Ukuran akhir: $UKURAN_AKHIR byte (awal: ${UKURAN_AWAL:-0} byte)"

          if [ "${UKURAN_AWAL:-0}" -gt 0 ]; then
            AMBANG=$(( UKURAN_AWAL * 70 / 100 ))
            if [ "$UKURAN_AKHIR" -lt "$AMBANG" ]; then
              echo "::error::Basis data menyusut dari $UKURAN_AWAL ke $UKURAN_AKHIR byte."
              echo "Cache TIDAK disimpan agar salinan lama tetap utuh."
              exit 1
            fi
          fi
          echo "aman=ya" >> "$GITHUB_OUTPUT"

      - name: Simpan basis data artikel
        if: steps.periksa_db.outputs.aman == 'ya'
        uses: actions/cache/save@v4
        with:
          path: data/mdk.sqlite3
          key: mdk-db-${{ github.run_id }}

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Terbitkan ke GitHub Pages
        id: penerbitan
        uses: actions/deploy-pages@v4

      # ---------------------------------------------------------------------
      # PENGAMAN 3 — salinan cadangan di luar cache.
      #
      # Cache Actions bukan tempat penyimpanan permanen: entri yang tidak
      # tersentuh selama tujuh hari dihapus otomatis, dan seluruh cache dapat
      # dibersihkan sewaktu-waktu. Selama basis data hanya hidup di sana, satu
      # kejadian buruk berarti kehilangan permanen.
      #
      # Langkah ini menyalinnya ke branch `cadangan-basis-data`, empat kali
      # sehari pada jalan penuh saja. Branch itu bersifat orphan dan selalu
      # ditimpa dengan satu komit tunggal, jadi repositori tidak menggelembung
      # oleh riwayat berkas biner.
      #
      # Untuk memulihkan: unduh data/mdk.sqlite3 dari branch tersebut, lalu
      # jalankan alur ini secara manual sesudah cache dibersihkan.
      # ---------------------------------------------------------------------
      - name: Cadangkan basis data ke branch terpisah
        if: steps.mode.outputs.mode == 'penuh' && steps.periksa_db.outputs.aman == 'ya'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/mdk.sqlite3 /tmp/cadangan.sqlite3
          git checkout --orphan cadangan-sementara
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p data
          cp /tmp/cadangan.sqlite3 data/mdk.sqlite3
          git add -f data/mdk.sqlite3
          git commit -q -m "Cadangan basis data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push --force -q origin cadangan-sementara:cadangan-basis-data
          echo "Cadangan tersimpan di branch cadangan-basis-data"

      - name: Ringkasan jalannya alur
        if: always()
        env:
          PYTHONPATH: src
        run: |
          {
            echo "### Ringkasan penerbitan"
            echo ""
            echo "- Mode: ${{ steps.mode.outputs.mode }} "
            echo "  (batas ${{ steps.mode.outputs.batas }} artikel)"
            echo "- Kuota Gemini: ${{ steps.kuota.outputs.boleh == 'true' && 'tersedia' || 'habis — tahap tulis dilewati' }}"
            echo "- URL: ${{ steps.penerbitan.outputs.page_url }}"
            echo ""
            echo '```'
            python -m mdk status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
