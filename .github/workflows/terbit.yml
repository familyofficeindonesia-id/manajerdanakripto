name: Ambil berita dan terbitkan situs

# =============================================================================
# JADWAL — dua irama berbeda
# -----------------------------------------------------------------------------
# Jadwal dinyatakan dalam UTC. WIB = UTC+7.
#
#   RINGAN  — setiap jam, menit :20
#     Hanya membaca umpan RSS langsung penerbit (kueri_entitas dimatikan).
#     Cepat, hemat, dan aman dijalankan 24x sehari. Menulis maksimal 3 artikel
#     per jalan, sehingga terbitan MENETES sepanjang hari alih-alih menumpuk
#     tiga kali sehari lalu sepi berjam-jam.
#
#   PENUH   — 4x sehari (01:50, 07:50, 13:50, 19:50 UTC
#             = 08.50, 14.50, 20.50, 02.50 WIB)
#     Menyertakan kueri entitas ke Google News. Langkah ini mengirim ratusan
#     permintaan (64+ tokoh x 2 alias x 2 template), jadi TIDAK boleh dijalankan
#     tiap jam — Google akan membatasi atau memblokir alamat IP runner.
#     Menulis maksimal 8 artikel per jalan.
#
# Catatan: cron GitHub Actions sering telat 5-20 menit pada jam sibuk dan
# sesekali dilewati sama sekali. Menit :20 dan :50 dipilih karena beban
# penjadwal GitHub paling berat tepat di menit :00.
# =============================================================================
on:
  schedule:
    - cron: "20 * * * *"
    - cron: "50 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      batas:
        description: "Jumlah maksimum artikel yang ditulis pada jalannya ini"
        required: false
        default: "10"

permissions:
  contents: write     # untuk menyimpan kembali basis data artikel
  pages: write
  id-token: write

# Wajib ada pada jadwal serapat ini. Tanpa ini, satu jalan yang melambat bisa
# ditabrak jalan berikutnya, dan keduanya berebut menerbitkan ke Pages.
concurrency:
  group: terbit
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    # 75 menit, bukan 45. Jalan penuh #62 sudah memakan 39 menit dengan susunan
    # umpan lama; dengan umpan tambahan, batas 45 terlalu mepet. Jalan ringan
    # tiap jam tetap selesai di bawah 10 menit, jadi angka ini hanya jaring
    # pengaman untuk empat jalan penuh per hari.
    timeout-minutes: 75

    steps:
      - name: Ambil repositori
        uses: actions/checkout@v4

      - name: Tentukan mode jalan
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE=penuh
            BATAS="${{ github.event.inputs.batas || 10 }}"
          elif [ "${{ github.event.schedule }}" = "50 1,7,13,19 * * *" ]; then
            MODE=penuh
            BATAS=8
          else
            MODE=ringan
            BATAS=3
          fi
          echo "mode=$MODE"   >> "$GITHUB_OUTPUT"
          echo "batas=$BATAS" >> "$GITHUB_OUTPUT"
          echo "Mode jalan: $MODE (batas $BATAS artikel)"

      # Kueri entitas hanya dipakai pada jalan penuh. Berkas konfigurasi disunting
      # di dalam runner saja; repositori tidak ikut berubah, karena checkout
      # bersifat sementara dan alur ini tidak pernah mendorong balik config/.
      - name: Matikan kueri entitas (jalan ringan)
        if: steps.mode.outputs.mode == 'ringan'
        run: |
          sed -i '/^kueri_entitas:/,/^[a-z_]/ s/^  aktif: true/  aktif: false/' config/sources.yaml
          grep -A1 '^kueri_entitas:' config/sources.yaml

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Pulihkan basis data artikel
        uses: actions/cache/restore@v4
        with:
          path: data/mdk.sqlite3
          key: mdk-db-${{ github.run_id }}
          restore-keys: mdk-db-

      - name: Uji kesehatan konfigurasi
        env:
          PYTHONPATH: src
        run: python -m mdk periksa

      - name: Ambil umpan berita
        env:
          PYTHONPATH: src
        run: python -m mdk ambil

      - name: Tulis ulang menjadi artikel Bahasa Indonesia
        continue-on-error: true      # situs tetap terbit walau langkah ini gagal
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m mdk tulis --batas ${{ steps.mode.outputs.batas }}

      - name: Bangun situs statis
        env:
          PYTHONPATH: src
        run: python -m mdk bangun

      - name: Tulis berkas CNAME (domain kustom)
        run: echo "manajerdanakripto.com" > dist/CNAME

      - name: Simpan basis data artikel
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/mdk.sqlite3
          key: mdk-db-${{ github.run_id }}

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Terbitkan ke GitHub Pages
        id: penerbitan
        uses: actions/deploy-pages@v4

      - name: Ringkasan jalannya alur
        env:
          PYTHONPATH: src
        run: |
          {
            echo "### Ringkasan penerbitan"
            echo ""
            echo "- Mode: ${{ steps.mode.outputs.mode }} "
            echo "  (batas ${{ steps.mode.outputs.batas }} artikel)"
            echo "- URL: ${{ steps.penerbitan.outputs.page_url }}"
            echo ""
            echo '```'
            python -m mdk status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
