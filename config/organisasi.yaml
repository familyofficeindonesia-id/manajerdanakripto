# =============================================================================
# ManajerDanaKripto.com — Registri Organisasi (Radar)
# -----------------------------------------------------------------------------
# Perusahaan dipantau sebagai entitas mandiri, terpisah dari tokohnya. Sebuah
# berita dapat menyebut perusahaan tanpa menyebut eksekutifnya, dan sebaliknya.
#
# KOLOM
#   slug          : pengenal URL
#   nama          : nama tampilan
#   nama_resmi    : nama badan hukum (dipakai untuk pencarian arsip SEC)
#   jenis         : manajer-aset | hedge-fund | ventura | treasury | riset | bursa | media
#   negara        : basis operasi
#   situs_web     : domain tanpa skema. Dipakai penemu umpan otomatis.
#                   KOSONG = jalankan `mdk radar temukan` lalu isi manual.
#   ticker        : kode saham bila terbuka (untuk pemantauan arsip & rilis)
#   edgar         : true = pantau pengajuan SEC (13F-HR, 8-K, S-1)
#   generik       : true = nama terlalu umum untuk dicari sendirian.
#                   Pembangun kueri akan SELALU menambahkan kata pembatas.
#   alias         : kata kunci pencarian tambahan
#   tokoh         : slug tokoh terkait pada config/entities.yaml
#   terverifikasi : false = domain & umpan belum dikonfirmasi mesin
#
# CATATAN PENTING
# Seluruh entri disetel terverifikasi=false. Domain di bawah ini adalah dugaan
# terbaik dan WAJIB dikonfirmasi dengan menjalankan:
#     python -m mdk radar temukan      (menemukan umpan RSS resmi otomatis)
#     python -m mdk radar periksa      (menguji setiap URL, menonaktifkan yang mati)
# Kedua perintah menulis hasilnya kembali ke config/watchlist.yaml.
# =============================================================================

