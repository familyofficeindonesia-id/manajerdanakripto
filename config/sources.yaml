# =============================================================================
# ManajerDanaKripto.com — Registri Sumber Berita
# -----------------------------------------------------------------------------
# Dua jenis sumber:
#   A. umpan_umum  : RSS tetap dari media yang meliput pasar aset digital.
#   B. kueri_entitas: template pencarian Google News yang dibangkitkan otomatis
#                     untuk setiap alias di config/entities.yaml.
#
# CATATAN HAK CIPTA
# Pipeline hanya menyimpan metadata (judul, tautan, ringkasan pendek, waktu,
# nama penerbit) untuk keperluan pemrosesan. Teks penuh TIDAK PERNAH
# dipublikasikan ulang. Setiap artikel yang tayang adalah tulisan orisinal
# berbahasa Indonesia yang selalu menautkan sumber aslinya.
#
# -----------------------------------------------------------------------------
# CATATAN PERUBAHAN — keandalan tanggal terbit
#
# Uji lapangan menunjukkan tautan Google News (`news.google.com/rss/articles/
# CBMi...`) tidak dapat dipecahkan menjadi alamat penerbit asli, sehingga
# tanggal terbit yang dilaporkannya tidak dapat diperiksa kebenarannya. Pada
# beberapa penerbit, tanggal itu terbukti keliru berbulan-bulan: artikel
# Februari dilaporkan sebagai berita Agustus.
#
# Umpan langsung penerbit tidak punya masalah ini — pengujian menunjukkan
# selisih 0,0 jam antara tanggal umpan dan metadata halaman aslinya.
#
# Karena itu susunan sumber digeser: umpan langsung diperkuat dan diperbanyak,
# kueri Google News diturunkan bobotnya menjadi pelengkap penemuan, bukan
# tulang punggung.
#
# -----------------------------------------------------------------------------
# CATATAN PERUBAHAN — memperbanyak pasokan berita
#
# Situs tampak sepi bukan karena alur jarang berjalan, melainkan karena terlalu
# sedikit berita yang lolos gerbang. Dua penyempitan dilonggarkan di sini:
#
#   1. LANTAI BOBOT 0,90 untuk umpan berbahasa Inggris. Dengan
#      relevansi.skor_minimum = 40, entitas yang muncul di JUDUL bernilai 45:
#
#        45 × 0,80 = 36  → gugur   (bobot lama pada enam umpan)
#        45 × 0,90 = 40  → lolos   (lantai baru)
#
#      Artinya berita yang menyebut manajer dana terpantau di judulnya kini
#      lolos meski tidak memuat kata kunci tema. Yang hanya menyebut entitas di
#      ringkasan (25 + 10 tema = 35 × 0,90 = 31) tetap gugur, jadi gerbangnya
#      longgar tetapi tidak bocor.
#
#   2. LEBIH BANYAK UMPAN LANGSUNG. Sekitar dua puluh umpan tambahan
#      ditambahkan agar antrean tidak kering di antara jalannya alur yang kini
#      berlangsung tiap jam.
#
# Umpan bertanda "PERLU DIUJI" belum diverifikasi. Jalankan tugas `periksa`
# setelah mengunggah berkas ini, lalu HAPUS baris mana pun yang gagal —
# membiarkan umpan mati hanya memperlambat setiap jalannya alur.
# =============================================================================

pengaturan_pengambilan:
  # User-Agent peramban. Beberapa penerbit (Bisnis Indonesia, CNBC Indonesia,
  # Kontan) menolak perayap dengan balasan 403 atau mengembalikan HTML alih-alih
  # XML bila agennya bukan peramban. Identitas asli tetap dicantumkan di akhir.
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like
    Gecko) Chrome/122.0.0.0 Safari/537.36 ManajerDanaKripto/1.0
    (+https://manajerdanakripto.com/tentang)
  timeout_detik: 20
  # Diturunkan dari 1,2 detik. Dengan jumlah umpan yang kini hampir dua kali
  # lipat, jeda lama membuat tahap pengambilan melewati lima menit per jalan.
  jeda_antar_umpan_detik: 0.8
  percobaan_ulang: 2
  # Dinaikkan dari 40. Umpan besar seperti Antara dan Detik memuat berita
  # nasional bercampur; 40 item teratas sering habis sebelum sampai ke berita
  # ekonomi yang relevan.
  maks_item_per_umpan: 60
  hormati_robots_txt: true

# --- A. Umpan RSS umum --------------------------------------------------------
# Bobot dinaikkan agar artikel dari sumber langsung menang di antrean penulisan.
# Urutan antrean memakai skor menurun, sehingga versi Google News atas peristiwa
# yang sama akan tersingkir sebagai pengulangan oleh pembanding riwayat judul.
umpan_umum:
  # --- Media kripto papan atas (tanggal terbukti akurat) ---
  - nama: "CoinDesk"
    url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
    bahasa: en
    bobot: 1.15
  - nama: "The Block"
    url: "https://www.theblock.co/rss.xml"
    bahasa: en
    bobot: 1.15
  # Blockworks DINONAKTIFKAN. Penelusuran memastikan umpan resminya memang
  # https://blockworks.co/feed dan dapat diurai (50 entri), tetapi entri
  # terbarunya berumur ~222 hari — umpannya berhenti diperbarui. Semua entri
  # akan ditolak saringan usia, jadi memanggilnya hanya membuang waktu.
  # Aktifkan kembali bila suatu saat umpannya hidup lagi:
  # - nama: "Blockworks"
  #   url: "https://blockworks.co/feed"
  #   bahasa: en
  #   bobot: 1.1
  - nama: "Cointelegraph"
    url: "https://cointelegraph.com/rss"
    bahasa: en
    bobot: 1.10
  - nama: "Decrypt"
    url: "https://decrypt.co/feed"
    bahasa: en
    bobot: 1.05
  - nama: "Bitcoin Magazine"
    url: "https://bitcoinmagazine.com/feed"
    bahasa: en
    bobot: 0.95
  - nama: "CryptoSlate"
    url: "https://cryptoslate.com/feed/"
    bahasa: en
    bobot: 0.95

  # --- Liputan institusional & kebijakan ---
  # DL News DIBUANG — penelusuran atas 23 alamat lazim tidak menemukan umpan
  # RSS apa pun. Situsnya tampaknya tidak lagi menyediakan RSS publik.
  - nama: "The Defiant"
    url: "https://thedefiant.io/feed"
    bahasa: en
    bobot: 0.95
  - nama: "Protos"
    url: "https://protos.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "Ledger Insights"
    url: "https://www.ledgerinsights.com/feed/"
    bahasa: en
    bobot: 1.00
  - nama: "Crypto Briefing"
    url: "https://cryptobriefing.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "Fortune — Crypto"
    url: "https://fortune.com/feed/fortune-feeds/?id=3230629"
    bahasa: en
    bobot: 0.95

  # --- Tambahan baru: media kripto arus utama berbahasa Inggris ---
  # PERLU DIUJI. Semuanya memakai pola WordPress /feed/ yang lazim, tetapi
  # belum diverifikasi dari runner. Hapus yang gagal pada tugas `periksa`.
  - nama: "BeInCrypto"
    url: "https://beincrypto.com/feed/"
    bahasa: en
    bobot: 0.95
  - nama: "Bitcoin.com News"
    url: "https://news.bitcoin.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "U.Today"
    url: "https://u.today/rss"
    bahasa: en
    bobot: 0.90
  - nama: "NewsBTC"
    url: "https://www.newsbtc.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "CryptoPotato"
    url: "https://cryptopotato.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "AMBCrypto"
    url: "https://ambcrypto.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "Bitcoinist"
    url: "https://bitcoinist.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "The Daily Hodl"
    url: "https://dailyhodl.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "CoinGape"
    url: "https://coingape.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "Finbold"
    url: "https://finbold.com/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "CoinJournal"
    url: "https://coinjournal.net/news/feed/"
    bahasa: en
    bobot: 0.90
  - nama: "Cryptonews"
    url: "https://cryptonews.com/news/feed/"
    bahasa: en
    bobot: 0.90

  # --- Sumber primer regulator (tanggal paling tepercaya yang ada) ---
  # PERLU DIUJI. Berguna khusus untuk rubrik Regulasi & Kebijakan.
  - nama: "SEC — Siaran Pers"
    url: "https://www.sec.gov/news/pressreleases.rss"
    bahasa: en
    bobot: 1.00

  # --- Keuangan umum ---
  - nama: "Yahoo Finance — Crypto"
    url: "https://finance.yahoo.com/news/rssindex"
    bahasa: en
    bobot: 0.85
  # Alamat pencarian lama menjawab 200 tanpa entri. Bentuk /device/rss/ adalah
  # umpan resmi CNBC yang masih dipelihara. Uji ulang untuk memastikan.
  - nama: "CNBC — Finance"
    url: "https://www.cnbc.com/id/10000664/device/rss/rss.html"
    bahasa: en
    bobot: 0.90
  # Reuters tidak lagi menyediakan RSS publik, sehingga jalur ini terpaksa
  # lewat Google News dan mewarisi ketidakandalan tanggalnya. Bobot ditahan di
  # bawah lantai 0,90 dengan sengaja: ini satu-satunya umpan_umum yang
  # tanggalnya tidak dapat diperiksa, jadi ia harus kalah dari sumber langsung.
  - nama: "Reuters via Google News"
    url: "https://news.google.com/rss/search?q=crypto+fund+OR+bitcoin+ETF+site:reuters.com&hl=en-US&gl=US&ceid=US:en"
    bahasa: en
    bobot: 0.85

  # --- Media Indonesia: konteks lokal dan pembanding ---
  # Kontan, Bisnis Indonesia, CNBC Indonesia, Coinvestasi, dan Bitcoin.co.id
  # dibuang karena tidak menyediakan RSS.
  #
  # CATATAN BOBOT — bobot lokal sengaja di atas 1,0. Ambang skor_minimum = 40,
  # sementara entitas yang hanya muncul di ringkasan bernilai 25 dan kata kunci
  # tema menambah 10 (total 35). Media Indonesia jarang menyebut nama manajer
  # dana di judul, sehingga tanpa pengangkatan bobot hampir semua berita lokal
  # gugur sebelum sempat masuk jatah lokal di tahap penulisan.
  #
  #   entitas di ringkasan + tema : 35 × 1,15 = 40  -> lolos (pas di ambang)
  #   entitas di ringkasan saja   : 25 × 1,15 = 28  -> gugur
  #
  # Karena itu 1,15 adalah lantai untuk sumber lokal. Di bawah itu (mis. 1,10
  # menghasilkan 38) berita lokal bersinyal sedang gugur seluruhnya. Perlu
  # dicatat: item tanpa entitas terpantau tetap dibuang lebih dulu oleh
  # `ingest.py`, jadi yang lolos di ambang ini pasti menyebut tokoh atau
  # organisasi yang memang dipantau — bukan berita umum sembarangan.
  - nama: "Blockchain Media Indonesia"
    url: "https://blockchainmedia.id/feed/"
    bahasa: id
    bobot: 1.25
  - nama: "Detik Finance"
    url: "https://finance.detik.com/rss"
    bahasa: id
    bobot: 1.15
  - nama: "Katadata"
    url: "https://katadata.co.id/rss"
    bahasa: id
    bobot: 1.15
  # Antara memuat seluruh berita nasional, sehingga kepadatan topik kriptonya
  # rendah. Bobot tetap di lantai 1,15 agar berita lokal yang relevan tidak
  # gugur; penyaringan sesungguhnya dilakukan oleh syarat entitas terpantau.
  - nama: "Antara — Terkini"
    url: "https://www.antaranews.com/rss/terkini"
    bahasa: id
    bobot: 1.15
  # Diaktifkan: umpan ekonomi lebih padat topik daripada /rss/terkini.
  # PERLU DIUJI — bila gagal, hapus baris ini saja, /rss/terkini tetap jalan.
  - nama: "Antara — Ekonomi"
    url: "https://www.antaranews.com/rss/ekonomi"
    bahasa: id
    bobot: 1.20

  # --- Tambahan baru: media ekonomi Indonesia ---
  # PERLU DIUJI seluruhnya. Ini penyumbang terbesar bagi "rasa lokal" situs,
  # jadi berbaik hati menguji satu per satu sepadan dengan waktunya.
  - nama: "Liputan6 — Bisnis"
    url: "https://feed.liputan6.com/rss/bisnis"
    bahasa: id
    bobot: 1.15
  # DIBUANG 2 Sep 2026 — Tempo — Bisnis (https://rss.tempo.co/bisnis)
  #
  # Catatan uji 28 Agu memerintahkan pemantauan dan pembuangan bila umur entri
  # terbaru masih di atas 36 jam. Uji 2 Sep: umpan tetap balas 200 dengan 50
  # entri, tetapi entri TERBARU berumur 221 jam (sekitar sembilan hari) — naik
  # dari 102 jam. Umpannya hidup, isinya yang tidak diperbarui.
  #
  # Tugas `cari` pada uji-umpan mencoba 23 alamat di tempo.co dan tidak
  # menemukan satu pun umpan aktif, jadi tidak ada alamat pengganti untuk
  # dipasang. Dibuang, bukan diganti.
  #
  # Bila kelak Tempo menghidupkan kembali umpannya, jalankan `cari tempo.co`
  # dan pasang alamat yang ditemukan dengan bobot 1.15 seperti semula.
  - nama: "Republika"
    url: "https://www.republika.co.id/rss"
    bahasa: id
    bobot: 1.15

  # --- Dibuang setelah uji umpan 28 Agustus 2026 ---
  # Keempatnya gagal dan sudah dikeluarkan. Dicatat di sini agar tidak
  # ditambahkan kembali secara tidak sengaja di kemudian hari:
  #
  #   CNN Indonesia — Ekonomi   403  (perayap ditolak meski User-Agent peramban)
  #     https://www.cnnindonesia.com/ekonomi/rss
  #   Suara — Bisnis            301  (pengalihan tidak diikuti pengurai)
  #     https://www.suara.com/rss/bisnis
  #   Merdeka — Uang            404  (alamat tidak ada)
  #     https://www.merdeka.com/feed/uang
  #   Okezone — Ekonomi         200  (30 entri, terbaru berumur ~10 tahun)
  #     https://sindikasi.okezone.com/index.php/rss/6/RSS2.0
  #
  # Calon pengganti, BELUM DIUJI sama sekali — ini tebakan pola alamat, bukan
  # hasil penelusuran. Aktifkan satu per satu lalu jalankan "Uji Umpan Berita";
  # jangan aktifkan semuanya sekaligus lalu menebak mana yang gagal.
  # - nama: "Merdeka — Uang"
  #   url: "https://www.merdeka.com/uang/feed"
  #   bahasa: id
  #   bobot: 1.15
  # - nama: "Suara — Bisnis"
  #   url: "https://suara.com/rss/bisnis"
  #   bahasa: id
  #   bobot: 1.15

# --- B. Template kueri per entitas -------------------------------------------
# {q} diganti alias entitas (URL-encoded) oleh src/mdk/ingest.py
#
# PENTING — alur `terbit.yml` MEMATIKAN bagian ini pada jalan ringan (tiap jam)
# dengan menyunting `aktif: true` menjadi `false` di dalam runner. Kueri entitas
# mengirim ratusan permintaan ke Google News per jalan; menjalankannya 24x
# sehari akan membuat alamat IP runner dibatasi. Bagian ini hanya hidup pada
# empat jalan penuh per hari. Jangan mengubah baris `  aktif: true` di bawah
# menjadi bentuk lain — perintah sed di alur mencocokkannya persis.
#
# CATATAN BOBOT — angka di bawah dihitung terhadap relevansi.skor_minimum = 40.
# Skor akhir = int(skor_mentah × bobot). Entitas di judul bernilai 45, kata
# kunci tema menambah 10.
#
#   nama tokoh saja        : 45 × 0,80 = 36  → GUGUR
#   nama tokoh + tema      : 55 × 0,80 = 44  → lolos
#
# Jadi Google News kini hanya meloloskan berita yang menyebut tokoh DAN
# bertema kripto. Bila bobot diturunkan di bawah 0,73, seluruh kueri entitas
# akan mati total — bukan sekadar melemah. Jangan ubah tanpa menghitung ulang.
kueri_entitas:
  aktif: true
  template:
    - nama: "Google News — nama tokoh"
      url: "https://news.google.com/rss/search?q=%22{q}%22&hl=en-US&gl=US&ceid=US:en"
      bobot: 0.80
    - nama: "Google News — tokoh + kripto"
      url: "https://news.google.com/rss/search?q=%22{q}%22+(crypto+OR+bitcoin+OR+ETF+OR+fund)&hl=en-US&gl=US&ceid=US:en"
      bobot: 0.85
  # Batasi jumlah alias yang dipakai per tokoh agar kuota permintaan terkendali.
  maks_alias_per_tokoh: 2
  # Hanya alias pertama (nama lengkap) yang dipakai bila mode hemat diaktifkan.
  mode_hemat: false

# --- Kata kunci tema (penambah skor relevansi) -------------------------------
# Ditambah istilah berbahasa Indonesia. Sebelumnya seluruh daftar berbahasa
# Inggris, sehingga berita lokal kehilangan tambahan 10 poin tema dan gugur
# di ambang 40 meski menyebut entitas terpantau.
kata_kunci_tema:
  - "bitcoin"
  - "ethereum"
  - "crypto"
  - "digital asset"
  - "ETF"
  - "ETP"
  - "fund"
  - "AUM"
  - "custody"
  - "tokenization"
  - "stablecoin"
  - "allocation"
  - "institutional"
  - "treasury"
  - "SEC"
  - "portfolio"
  # --- istilah Indonesia ---
  - "kripto"
  - "aset digital"
  - "aset kripto"
  - "manajer investasi"
  - "reksa dana"
  - "portofolio"
  - "bursa kripto"
  - "pedagang aset kripto"
  - "kustodian"
  - "tokenisasi"
  - "dana kelolaan"
  - "investor institusi"
  - "blockchain"

# --- Daftar tolak (menekan positif palsu) ------------------------------------
kata_kunci_tolak:
  - "horoscope"
  - "recipe"
  - "sports betting odds"
  - "celebrity gossip"
  - "giveaway"
  - "airdrop scam"
  - "sponsored post"
  - "press release distribution"
  # Tambahan Indonesia — umpan seperti Antara, Suara, dan Okezone memuat
  # seluruh berita nasional, jadi penolakan eksplisit menghemat pemrosesan.
  - "ramalan zodiak"
  - "resep masakan"
  - "sinopsis"
  - "jadwal siaran"
  - "prediksi skor"
  - "link nonton"
  - "kunci jawaban"
  - "lowongan kerja"

# Penerbit yang tidak pernah diambil (konten berbayar penuh / paywall keras /
# agregator berkualitas rendah / tanggal terbit tidak dapat dipercaya).
#
# Daftar ini digabung dengan PENERBIT_DIBLOKIR_TETAP di src/mdk/ingest.py.
# Pencocokan berlaku pada domain tautan MAUPUN nama penerbit, sehingga bekerja
# untuk item yang datang lewat Google News (yang domainnya selalu
# news.google.com dan menyembunyikan penerbit aslinya).
penerbit_diblokir:
  - "example-content-farm.com"
  # Menerbitkan ulang artikel lama dengan tanggal baru. Artikel 3 Februari 2026
  # dilaporkan sebagai berita 16 Agustus 2026 — selisih lebih dari lima bulan.
  - "yellow.com"
