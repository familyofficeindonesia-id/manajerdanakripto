  # ===========================================================================
  # ENTITAS INDONESIA
  # ---------------------------------------------------------------------------
  # Ditambahkan agar berita dari umpan lokal (Blockchain Media Indonesia, Detik
  # Finance, Katadata, Antara) dapat dikenali sebagai relevan. Tanpa entitas
  # yang cocok, `ingest.py` membuang item apa pun berapa pun skor temanya —
  # syarat `not it.entitas` dievaluasi sebelum ambang skor.
  #
  # CATATAN JENIS
  # Daftar jenis yang dikenal: manajer-aset | hedge-fund | ventura | treasury |
  # riset | bursa | media. Regulator dan asosiasi tidak punya jenis sendiri,
  # sehingga sementara ditandai `riset`. Bila `entities.py` tidak memvalidasi
  # nilai jenis, tambahkan `regulator` dan `asosiasi` agar lebih tepat.
  #
  # Kolom `tokoh` sengaja dikosongkan. Mengisinya dengan slug yang belum ada di
  # config/entities.yaml berisiko memutus registri saat dimuat.
  # ===========================================================================

