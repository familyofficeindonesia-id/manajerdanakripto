slug: kontak
judul: Kontak dan Hak Jawab
eyebrow: Redaksi
deskripsi: Cara menghubungi redaksi untuk koreksi, hak jawab, kerja sama, atau keberatan hak cipta.
isi: |
  <p>Kami membaca setiap surel yang masuk dan berupaya menjawab dalam dua hari kerja.</p>

  <h2>Redaksi</h2>
  <p>Untuk koreksi fakta, pengajuan hak jawab, atau pertanyaan mengenai sebuah
  artikel, kirimkan surel ke <strong>redaksi@manajerdanakripto.com</strong>.
  Sertakan tautan artikel, bagian yang dipersoalkan, dan dokumen pendukung bila ada.</p>

  <h2>Keberatan hak cipta</h2>
  <p>Bila Anda pemegang hak atas materi yang Anda nilai digunakan secara tidak
  semestinya, kirimkan rincian tautan dan bukti kepemilikan ke alamat yang sama
  dengan subjek <em>Keberatan Hak Cipta</em>. Kami akan meninjau dan menindaklanjuti.</p>

  <h2>Kerja sama dan iklan</h2>
  <p>Permintaan kerja sama distribusi konten, riset bersama, atau pemasangan
  iklan dapat dikirimkan ke alamat yang sama dengan subjek <em>Kerja Sama</em>.
  Kerja sama komersial tidak memengaruhi keputusan redaksi.</p>

  <h2>Ikuti kanal kami</h2>
  <p>Pembaruan harian juga tersedia melalui <a href="/rss.xml">umpan RSS</a> dan
  buletin surel yang dapat Anda ikuti dari beranda.</p>
