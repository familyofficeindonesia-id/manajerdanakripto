slug: tentang
judul: Tentang ManajerDanaKripto.com
eyebrow: Redaksi
deskripsi: Mengapa portal ini ada, bagaimana kami bekerja, dan apa yang tidak kami lakukan.
isi: |
  <p>ManajerDanaKripto.com memantau keputusan, pernyataan, dan posisi para pengelola
  dana serta investor institusional aset digital dunia, lalu menyajikannya kembali
  dalam Bahasa Indonesia yang jelas dan disertai konteks pasar domestik.</p>

  <p>Pembaca Indonesia selama ini harus membaca kabar tentang manajer dana global
  melalui media berbahasa Inggris, tanpa penjelasan mengenai relevansinya bagi
  portofolio dalam rupiah, bagi kerangka pengawasan di dalam negeri, maupun bagi
  akses produk yang tersedia di sini. Kekosongan itulah yang kami isi.</p>

  <h2>Apa yang kami lakukan</h2>
  <p>Redaksi memantau lebih dari enam puluh tokoh — mulai dari pengelola ETF,
  dana lindung nilai, modal ventura, hingga analis makro — beserta organisasi
  tempat mereka bekerja. Setiap pemberitaan yang relevan ditulis ulang menjadi
  laporan orisinal berbahasa Indonesia, diklasifikasikan ke dalam rubrik,
  ditandai dengan tokoh terkait, dan dilengkapi blok <em>Konteks Indonesia</em>
  yang menjelaskan kaitannya dengan pasar dan regulasi dalam negeri.</p>

  <h2>Kebijakan hak cipta</h2>
  <p>Kami tidak menerbitkan ulang artikel media lain. Setiap tulisan disusun
  sendiri oleh redaksi berdasarkan fakta yang tersedia, dengan kutipan langsung
  dibatasi maksimum empat belas kata dan hanya satu kutipan per artikel. Sumber
  asli selalu disebutkan dan ditautkan pada bagian atribusi di akhir tulisan.
  Bila Anda merupakan pemegang hak atas materi tertentu dan berkeberatan,
  silakan menghubungi redaksi.</p>

  <h2>Bagaimana label sinyal dibaca</h2>
  <p>Label <strong>Akumulasi</strong>, <strong>Netral</strong>, dan
  <strong>Distribusi</strong> merupakan pembacaan redaksi atas kecenderungan
  sebuah pemberitaan. Label ini bukan konfirmasi posisi portofolio yang
  dilaporkan secara resmi, bukan proyeksi harga, dan bukan rekomendasi.</p>

  <h2>Apa yang tidak kami lakukan</h2>
  <p>Kami tidak memberikan nasihat investasi, tidak mengelola dana pembaca, tidak
  memungut biaya untuk liputan, dan tidak menerima pembayaran untuk menampilkan
  atau menghilangkan sebuah pemberitaan.</p>
