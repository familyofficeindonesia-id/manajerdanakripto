slug: pedoman
judul: Pedoman Media Siber dan Etika Redaksi
eyebrow: Redaksi
deskripsi: Standar verifikasi, koreksi, dan pemuatan hak jawab yang kami terapkan.
isi: |
  <p>Redaksi ManajerDanaKripto.com berupaya menjalankan praktik jurnalistik yang
  sejalan dengan Pedoman Pemberitaan Media Siber serta Kode Etik Jurnalistik yang
  berlaku di Indonesia.</p>

  <h2>Verifikasi</h2>
  <p>Setiap artikel merujuk pada sumber yang dapat diperiksa dan ditautkan secara
  terbuka. Kami tidak menerbitkan klaim tanpa sumber. Bila sebuah informasi masih
  berupa laporan sepihak atau belum terkonfirmasi, status tersebut dinyatakan
  secara eksplisit di dalam tulisan.</p>

  <h2>Ralat dan koreksi</h2>
  <p>Kesalahan faktual yang ditemukan akan diperbaiki secepatnya. Perbaikan
  substansial dicatat pada bagian akhir artikel beserta waktu koreksinya. Kami
  tidak menghapus artikel secara diam-diam.</p>

  <h2>Hak jawab dan hak koreksi</h2>
  <p>Pihak yang merasa dirugikan oleh pemberitaan dapat mengajukan hak jawab atau
  hak koreksi melalui halaman kontak. Pengajuan yang memenuhi syarat akan dimuat
  secara proporsional dan tanpa dipungut biaya.</p>

  <h2>Independensi</h2>
  <p>Kami tidak menerima pembayaran untuk memuat, mengubah, atau menghapus
  pemberitaan. Bila di kemudian hari terdapat konten bersponsor, konten tersebut
  akan ditandai dengan jelas dan dipisahkan dari kanal berita.</p>

  <h2>Kecerdasan buatan dalam alur kerja</h2>
  <p>Kami menggunakan bantuan kecerdasan buatan untuk menyaring, menerjemahkan
  konteks, dan menyusun draf awal artikel berbahasa Indonesia. Setiap keluaran
  tunduk pada pagar redaksi otomatis — pembatasan panjang kutipan, kewajiban
  atribusi sumber, dan larangan memberi nasihat investasi — serta ditinjau
  redaksi sebelum dianggap final. Tanggung jawab atas isi sepenuhnya berada pada
  redaksi, bukan pada perangkat yang digunakan.</p>
